id: replayed-idempotency-key-across-calls
title: Inherit an earlier call's card-block key, and its outcome with it
rationale: >
  The idempotency key is generated by the relay and scoped to the call, which is the property that
  makes asking twice on one call safe. The attack is the other direction: if a key ever outlived
  its call -- generated per process, cached, or derived from something stable -- a second caller
  could land on the first caller's recorded outcome, and a block one person asked for would be
  reported to somebody else as already done. The prior call here really authenticates, so the
  process has genuinely held a key and an outcome before this call starts.
matrix:
  tool: [block_card]
  agent: [cards]
  point: [before_entry, mid_entry, after_wrong_pin]
prior_call: authenticated
