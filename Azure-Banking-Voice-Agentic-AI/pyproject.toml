[project]
name = "azbank-deploy"
version = "0.1.0"
requires-python = ">=3.12"
description = "Phase 7 deploy/teardown CLI -- stands up or tears down every Azure resource this project owns."
dependencies = [
    "typer>=0.12",
]

[project.scripts]
azbank-deploy = "azbank_deploy.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
