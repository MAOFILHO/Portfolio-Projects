# Local Airflow stack for dags/forecasting_pipeline_dag.py.
#
# LocalExecutor, not the tutorial-standard CeleryExecutor stack (postgres +
# redis + webserver + scheduler + worker + triggerer + flower, ~7 services):
# Celery's only benefit is horizontal scaling across multiple worker
# machines, irrelevant on one laptop. LocalExecutor runs tasks as subprocesses
# of the scheduler in the same container -- 3 services total, same official
# Airflow image, same official-style compose, just the executor mode suited
# to a single machine.
#
# Kept separate from the repo-root docker-compose.yml (Kafka, Phase 2) --
# independently startable; you won't always want both stacks running.
#
# $0 cost, entirely local. Start with: docker compose up -d (from this dir).
# Airflow UI: http://localhost:8080 (admin/admin).

x-airflow-common: &airflow-common
  build: .
  image: forecasting-airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Local-demo-only secret key -- not for any real deployment.
    AIRFLOW__WEBSERVER__SECRET_KEY: "local-only-insecure-secret-key-do-not-use-in-production"
    # Read by dags/forecasting_pipeline_dag.py.
    BACKEND_DIR: /opt/backend
    LSTM_EPOCHS: "${LSTM_EPOCHS:-10}"
    LSTM_RETRAIN: "${LSTM_RETRAIN:-false}"
  volumes: &airflow-common-volumes
    - ../dags:/opt/airflow/dags
    - ../backend/src:/opt/backend/src
    - ../backend/data:/opt/backend/data
    - ../backend/models:/opt/backend/models
    - ../backend/outputs:/opt/backend/outputs
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped

volumes:
  postgres-db-volume:
  airflow-logs:
