[pytest]
# Each entry below silences one specific, verified-benign warning that comes
# from a pinned third-party dependency's internals, not from this project's
# own code. Every entry is scoped as narrowly as possible (by message and,
# where the warning's reported module is reliable, by module) rather than
# blanket-silencing a whole category — see the comment above each entry for
# why it can't be fixed at the source without breaking a pinned dependency.
filterwarnings =
    # protobuf's compiled C extension (bundled transitively via TensorFlow,
    # which pins protobuf<5.0.0dev) creates warning-triggering metaclasses on
    # import. Only fixable by protobuf itself changing its C-extension
    # implementation, or by TensorFlow allowing a newer protobuf.
    ignore:.*PyType_Spec with a metaclass that has custom tp_new.*:DeprecationWarning

    # Keras 3 (bundled with tensorflow==2.16.1) internally converts an
    # ndim>0 array to a scalar in its own history-logging utility. This is
    # Keras's own code, not ours; only fixable by upgrading TensorFlow/Keras.
    ignore:Conversion of an array with ndim > 0 to a scalar is deprecated.*:DeprecationWarning:keras\.src\.utils\.python_utils

    # pandas's Series/DataFrame .plot() (used throughout our eda.py and
    # lstm_model.py plotting code) touches a matplotlib internal attribute
    # that matplotlib 3.11 just deprecated. This is pandas's own plotting
    # compatibility shim, not our plotting code; tracked upstream in pandas,
    # not yet fixed even in the latest pandas release as of this writing.
    ignore:The locs attribute was deprecated in Matplotlib 3\.11.*:matplotlib._api.deprecation.MatplotlibDeprecationWarning:pandas\.plotting\._matplotlib\.converter

    # statsmodels' KPSS stationarity test warns whenever the computed
    # statistic falls outside its internal p-value lookup table — expected,
    # informational behavior for this dataset's strong trend (see eda.py),
    # not a bug: the true p-value is simply smaller than the reported bound.
    ignore:The test statistic is outside of the range of p-values available in the.*:statsmodels.tools.sm_exceptions.InterpolationWarning

    # pyspark==3.5.9's own Arrow/pandas interop code (sql/pandas/utils.py,
    # sql/pandas/types.py) uses distutils.LooseVersion for version comparisons
    # and pandas' is_datetime64tz_dtype, both deprecated by pandas/Python
    # upstream of this pinned pyspark release. This is pyspark's own internal
    # code, not our ETL code (src/data_loading.py, src/preprocessing.py); only
    # fixable by upgrading pyspark past 3.5.x.
    ignore:distutils Version classes are deprecated.*:DeprecationWarning:pyspark\.sql\.pandas\.utils
    ignore:is_datetime64tz_dtype is deprecated.*:DeprecationWarning:pyspark\.sql\.pandas\.types
