# Serves the built dashboard (static files) and reverse-proxies /api/* to
# the backend container -- this is what lets the frontend be reachable on
# a single public port (80) instead of needing the backend's 8000 exposed
# separately. See frontend.Dockerfile and docker-compose.cloud.yml.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Model training runs can take a while (auto_arima grid search);
        # keep the connection open rather than timing out the poll.
        proxy_read_timeout 120s;
    }

    # SPA fallback: any non-/api, non-file path resolves to index.html so
    # React Router's client-side routes work on a hard refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
