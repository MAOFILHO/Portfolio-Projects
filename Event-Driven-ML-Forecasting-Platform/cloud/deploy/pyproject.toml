[project]
name = "forecast-deploy"
version = "0.1.0"
description = "Deployment CLI for running Event-Driven-ML-Forecasting-Platform on a single Azure VM."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[project.scripts]
forecast-deploy = "forecast_deploy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_deploy"]
