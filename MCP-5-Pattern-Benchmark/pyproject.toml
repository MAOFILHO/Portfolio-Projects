[project]
authors = []
name = "mcp-pattern-benchmark"
requires-python = ">=3.12,<3.13"  # matches Dockerfile python:3.12-slim
version = "0.0.1"
dependencies = [
  # harness
  "litellm==1.80.0",
  "mcp>=1.9.0,<2",  # 2.x renames streamablehttp_client
  "nest-asyncio>=1.6.0,<2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.1.1,<2",
  "pyyaml>=6.0.2,<7",
  # backend and verifiers
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg2-binary>=2.9.10,<3",
  # chart
  "matplotlib>=3.7.0",
  # tooling
  "ruff>=0.12.4,<0.13",
  "pytest>=8.3,<9",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  "osx-arm64",
  "linux-aarch64",
  "linux-64",
  "win-64",
  "osx-64",
]

[tool.pixi.tasks]
fmt = "ruff"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src", "tasks"]
