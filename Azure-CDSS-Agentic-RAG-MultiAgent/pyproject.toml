[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-cdss-pipeline"
version = "1.0.0"
description = "Automated zero-portal-click deployment of a Clinical Decision Support System on Azure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
observability = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
cdss-deploy = "cdss_deploy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cdss_deploy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live Azure credentials",
]
