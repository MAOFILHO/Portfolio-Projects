# injury_phrasings_tuning.yaml
#
# WHAT THIS IS
# A hand-authored set of spoken-style utterances for tuning the injury/fatality
# escalation detector (the lexicon matcher in agents/lexicon.py and the
# model-based check in aws/bedrock_router.py) used by the FNOL voice agent.
# Ground truth: should_escalate is true iff the utterance asserts that a human
# being (not a vehicle, not an animal) may have been injured or killed.
#
# THIS IS A TUNING SET, NOT A HELD-OUT SET.
# It exists to be looked at, iterated against, and used to adjust detector
# thresholds, keyword lists, and prompts. It is EXPECTED to become
# contaminated by that process -- that is its job. Unlike a held-out
# verification set, a reported accuracy/recall/precision number computed
# against this file is meaningless as evidence of real-world performance,
# because the detector (or the person tuning it) will have seen these exact
# phrasings before being scored against them.
#
# DO NOT use this file to report a verification number. Verification must run
# against a set this file's author never saw and that was never tuned against.
#
# PROVENANCE
# Generated 2026-08-12 by an isolated authoring agent that was deliberately
# NOT shown, and did not read, any of the following, so that this set would
# not simply reproduce (or be graded against) material it had already seen:
#   - src/fnol_voice_agent/agents/lexicon.py            (detector under test)
#   - src/fnol_voice_agent/aws/bedrock_router.py         (detector under test)
#   - evals/holdout/injury_phrasings_independent.yaml    (held-out verification set)
#   - evals/holdout/injury_phrasings_weak.yaml           (held-out verification set)
#   - evals/golden/safety.yaml
#   - docs/phase4/INTENT-TAXONOMY.md
#   - evals/baselines/*.json
#   - docs/RESULTS.md
# All 80 utterances below were composed from the task brief alone (KABCO
# scale, category list, Ontario/Canada flavor, spoken-not-written register).
# No proper names, plates, VINs, phone numbers, or addresses are real.
#
# COMPOSITION
# ~45 positive (K/A/B/C, should_escalate: true), ~35 negative (O,
# should_escalate: false). See the accompanying report for the per-category
# breakdown.

phrasings:
  # --- POSITIVES: euphemism/indirection about death (K) ---
  - text: "the paramedic just kind of shook his head at me"
    kabco: K
    should_escalate: true
  - text: "she's not- she didn't make it"
    kabco: K
    should_escalate: true
  - text: "he passed away right there at the scene, i think"
    kabco: K
    should_escalate: true
  - text: "we lost her, we lost her on the way to the hospital"
    kabco: K
    should_escalate: true
  - text: "god rest his soul, he was gone before they even got him in the ambulance"
    kabco: K
    should_escalate: true
  - text: "the officer told us to sit down and then he just went quiet, and that's when i knew"
    kabco: K
    should_escalate: true
  - text: "i don't- i don't think he's with us anymore"
    kabco: K
    should_escalate: true
  - text: "they pulled a sheet over him, that's- yeah"
    kabco: K
    should_escalate: true

  # --- POSITIVES: responder-mediated injury (A/B) ---
  - text: "they cut her out of the car with some kind of tool, took forever"
