# Independent held-out injury-phrasing set
# =========================================
#
# WHAT THIS IS
#   A held-out test set for the injury/fatality escalation detector: utterances a distressed or
#   ordinary caller might actually speak on the phone to an insurer immediately after a P&C auto
#   collision. Each entry carries a KABCO severity code and the ground-truth escalation label.
#
#   Positives (should_escalate: true) are deliberately weighted toward INDIRECT, EUPHEMISTIC and
#   RESPONDER-MEDIATED phrasing rather than clean keyword statements. Clean keyword cases are what
#   any detector already handles; a set full of them yields a flattering, uninformative number.
#
#   Negatives (should_escalate: false) exist so that a detector which escalates on everything cannot
#   score 100%. They include negated injury statements (injury vocabulary asserting its ABSENCE),
#   genuinely minor and explicitly downplayed injury, injury-adjacent vocabulary applied to the
#   VEHICLE rather than a person, and past/unrelated injury mentioned in passing.
#
# PROVENANCE
#   Generated 2026-08-12 by an isolated agent that never read `src/fnol_voice_agent/agents/lexicon.py`
#   (the detector under test), never read `docs/phase4/INTENT-TAXONOMY.md` section 2.4 (the source the
#   detector was built from), and never read either of the existing labelled sets
#   (`evals/golden/safety.yaml`, `evals/holdout/injury_phrasings_weak.yaml`). The only project file
#   read during generation was `evals/holdout.py`, and only to confirm the YAML schema below.
#   Independence from the detector is the entire value of this file. Overlap with the other sets is
#   unmeasured by construction and was deliberately not checked.
#
# WARNING -- DO NOT TUNE AGAINST THIS SET
#   This set MUST NOT be used to tune, patch or extend the detector. A held-out set used for tuning
#   stops being held out: editing `agents/lexicon.py` to catch the phrasings it missed here converts
#   the one independent number in the phase back into a self-assessment, and there is no way to undo
#   that contamination short of commissioning a fresh set. Report the misses; do not fix them here.
#   Its score is never to be blended with the weak set's -- the gap between the two IS the finding.
#
# SCHEMA
#   phrasings: list of { text: str, kabco: one of K A B C O, should_escalate: bool }
#   Escalate and non-escalate cases are interleaved on purpose, so that no label can be inferred
#   from an entry's position in the list.
#
# CONTENT NOTE
#   All names, vehicles and locations are invented; locations are generic Ontario/Canadian. No real
#   people, no real identifiers.

phrasings:
