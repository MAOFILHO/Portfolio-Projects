[project]
name = "fnol-voice-agent"
version = "0.1.0"
description = "Agentic, voice-first FNOL intake for P&C personal auto insurance (Amazon Connect + Lex V2 + Bedrock + LangGraph). Portfolio prototype."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT-0" }

dependencies = [
    # boto3: Bedrock (embeddings, model calls) and DynamoDB (vector storage, ADR-002; checkpointer, ADR-005)
    # are both reached through it. Pinned to a known-good release, per CLAUDE.md's "pin exact versions" rule.
    # Bumped from 1.35.99 (Phase 3) to satisfy langgraph-checkpoint-aws==1.2.1's boto3>=1.42.90 floor,
    # discovered as a real dependency conflict when Stage 6/7 added that package -- not a proactive bump.
    "boto3==1.43.69",
    # pydantic: typed FNOL/claim/policy/vehicle/event schemas (Phase 5 models/) -- industry-standard runtime
    # validation, already assumed by TARGET-LAYOUT.md's "adapted Pydantic v2" mapping from repo 6.
    "pydantic==2.13.4",
    # python-dateutil: fuzzy loss_datetime parsing ("yesterday about 5:30") -- SLOT-DESIGN.md names
    # dateutil-class parsing explicitly as the mechanism for this slot.
    "python-dateutil==2.9.0.post0",
    # openfeature-sdk: the generation-tier kill-switch flag (ADR-004) and the broader kill-switch model
    # AI-USE-CASE-CARD.md commits to ("OpenFeature flags gate model tier... each taking effect on the next
    # turn"). Uses the in-memory provider -- zero external service, zero cost.
    "openfeature-sdk==0.10.0",
    # numpy: brute-force cosine similarity over the corpus's embedding vectors, per ADR-002's chosen
    # retrieval mechanism (a single vectorized operation, not a new AWS service).
    "numpy==2.5.2",
    # mcp: the official Model Context Protocol SDK. Needed for exactly one thing -- ADR-012's falsifiable
    # test that the same tool handlers are servable over the real wire protocol without modification. Not
    # used on the runtime hot path (ADR-012 keeps that in-process).
    "mcp==2.0.0",
    # langgraph: agent orchestration, per ADR-003. Stage 6/7's graph, nodes, and state schema.
    "langgraph==1.2.11",
    # langgraph-checkpoint-aws: DynamoDB-backed state persistence keyed on the Connect contact ID, per
    # ADR-005 -- adopted instead of hand-writing a BaseCheckpointSaver.
    "langgraph-checkpoint-aws==1.2.1",
    # PyYAML: the Phase 6 golden set is authored and reviewed as text (SUCCESS-METRICS.md §9 requires
    # changes to it be reviewed as code), and YAML's comments and block scalars make a 60+ conversation
    # corpus reviewable in a way JSON's escaped one-liners do not.
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    # pytest: test runner -- TDD discipline (CLAUDE.md "How to work here").
    "pytest==8.3.4",
    # moto: in-memory AWS mocks for DynamoDB -- lets the ingestion pipeline's tests and its default
    # `--vector-store local` mode run with zero AWS credentials and zero spend, per the project's
    # "everything runs locally without AWS" constraint.
    "moto[dynamodb]==5.0.28",
    # ruff: lint, per CLAUDE.md's stated toolchain.
    "ruff==0.9.4",
    # black: format, per CLAUDE.md's stated toolchain.
    "black==25.1.0",
    # mypy: strict type checking, per CLAUDE.md's `make typecheck`.
    "mypy==1.14.1",
    # boto3-stubs: type stubs for the boto3 clients this project uses -- keeps `mypy strict`
    # honest instead of suppressing the untyped-import error for boto3 wholesale.
    "boto3-stubs[dynamodb,bedrock-runtime]==1.43.69",
    # types-python-dateutil: dateutil ships no inline types; needed to keep mypy strict clean on the
    # fuzzy loss_datetime parser.
    "types-python-dateutil==2.9.0.20260807",
    # types-PyYAML: same reason, for the golden-set loader.
    "types-PyYAML==6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `evals/` is a top-level directory per TARGET-LAYOUT.md ("golden set, component + conversation evals,
# judge rubrics") rather than a subpackage of src/ -- the golden corpus is data the harness reads, not
# library code that ships with the agent. This makes `import evals.…` work from tests and from
# `python -m evals.…` at the repo root, without installing the corpus into the wheel.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true

# langgraph_checkpoint_aws ships no py.typed marker / inline types (confirmed, not assumed --
# mypy's own import-untyped error is the confirmation). No stub package exists for it on PyPI either.
[[tool.mypy.overrides]]
module = "langgraph_checkpoint_aws.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
