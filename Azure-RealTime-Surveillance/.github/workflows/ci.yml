name: CI

# Runs on every push/PR — the "green light" gate for the deployment CLI,
# the shared detection/alert logic, the backend, and the frontend. This
# workflow does NOT touch Azure or spend money; see deploy.yml for that.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + shared + backend + ingestor dependencies
        run: |
          pip install -e ".[dev]"
          pip install -e ./shared
          pip install -r backend/requirements.txt
          pip install -r ingestors/nest/requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests shared backend/app function ingestors/nest

      - name: Unit tests
        run: pytest -v

  bicep-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep templates
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep --stdout > /dev/null

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Type-check + build
        working-directory: frontend
        run: npm run build
