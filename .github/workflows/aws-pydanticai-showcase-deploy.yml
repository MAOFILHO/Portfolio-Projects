name: AWS-PydanticAi-Showcase Deploy

# Deploy-on-demand: this workflow is never triggered by a push. Run it
# manually to build+push a new image and roll the ECS Fargate service —
# there's no idle cloud bill or standing LLM spend between deploys.
#
# Secrets/variables are prefixed SHOWCASE_ because this repo hosts multiple
# projects' deploy workflows sharing one secrets namespace.
on:
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ vars.SHOWCASE_AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.SHOWCASE_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.SHOWCASE_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.SHOWCASE_ECS_SERVICE }}

permissions:
  id-token: write # OIDC — no long-lived AWS keys stored in the repo
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-PydanticAi-Showcase
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SHOWCASE_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Roll the ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
