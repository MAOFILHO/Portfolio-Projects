name: AWS-PydanticAi-Showcase Deploy

# Deploy-on-demand: this workflow is never triggered by a push. Run it
# manually to build+push a new image and roll the ECS Fargate service —
# there's no idle cloud bill or standing LLM spend between deploys.
#
# Secrets/variables are prefixed SHOWCASE_ because this repo hosts multiple
# projects' deploy workflows sharing one secrets namespace.
on:
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ vars.SHOWCASE_AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.SHOWCASE_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.SHOWCASE_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.SHOWCASE_ECS_SERVICE }}

permissions:
  id-token: write # OIDC — no long-lived AWS keys stored in the repo
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-PydanticAi-Showcase
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SHOWCASE_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # The ECS task runs on ARM64/Graviton (terraform/ecs.tf's runtime_platform,
      # picked for the ~20% cheaper Fargate pricing) — but ubuntu-latest runners
      # are x86_64, so a plain `docker build` here produces an amd64 image that
      # crashes on the task with "exec format error". QEMU + buildx cross-builds
      # for ARM64 instead.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image (ARM64)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            --push .

      - name: Roll the ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
