name: Azure-RealTime-Video-Surveillance CI

# Runs on every push/PR that touches this project's folder -- the "green
# light" gate for the deployment CLI, the shared detection/alert logic, the
# backend, and the frontend. This workflow does NOT touch Azure or spend
# money; see azure-realtime-surveillance-deploy.yml for that.
on:
  push:
    branches: [main]
    paths:
      - "Azure-RealTime-Video-Surveillance/**"
  pull_request:
    branches: [main]
    paths:
      - "Azure-RealTime-Video-Surveillance/**"
  workflow_dispatch: {}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azure-RealTime-Video-Surveillance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + shared + backend + ingestor dependencies
        run: |
          pip install -e ".[dev]"
          pip install -e ./shared
          pip install -r backend/requirements.txt
          pip install -r ingestors/nest/requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests shared backend/app function ingestors/nest

      - name: Generate test fixture (gitignored — licensing unconfirmed for redistribution, see tests/fixtures/README.md)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -i sample_videos/swat-soldier-with-weapon-13884574-720p.mp4 -vframes 1 tests/fixtures/person_test_frame.jpg

      - name: Agentic AI unit tests (Semantic Kernel agents, mocked)
        run: |
          pytest -v \
            tests/test_triage_agent.py \
            tests/test_notification_policy_agent.py \
            tests/test_monitoring_agent.py \
            tests/test_diagnostic_agent.py \
            tests/test_query_route.py \
            tests/test_agents_activity_route.py \
            tests/test_function_app_agents.py

      - name: Unit tests (full suite)
        run: pytest -v

  bicep-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azure-RealTime-Video-Surveillance
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep templates
        uses: azure/cli@v2
        with:
          inlineScript: |
            cd Azure-RealTime-Video-Surveillance
            az bicep build --file infra/main.bicep --stdout > /dev/null

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azure-RealTime-Video-Surveillance/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Azure-RealTime-Video-Surveillance/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check + build
        run: npm run build
