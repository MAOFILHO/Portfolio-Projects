name: Azure-MicrosoftFoundry-Agentic-FineTuning-Platform — Deploy app (backend image + frontend)

# Manual only. Separate from the infra-only deploy workflow above on
# purpose: re-provisioning the AI infra (Foundry account, model
# deployments) and re-deploying the app itself (backend image, frontend
# static site) are independent, restartable operations — a code change
# shouldn't need to touch the AI infra, and vice versa.
#
# Builds+pushes the backend image to the public Docker Hub repo (see
# README — chosen over Azure Container Registry to stay at $0/mo), rolls
# the Container App to the new image (az containerapp update does NOT shift
# traffic automatically — the explicit `ingress traffic set` step below is
# required, a lesson this repo already learned the hard way on a different
# project), then builds and deploys the frontend to the Static Web App.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure-microsoftfoundry-agentic-finetuning-platform
  cancel-in-progress: false

jobs:
  backend:
    name: Build + push backend image, roll Container App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azure-MicrosoftFoundry-Agentic-FineTuning-Platform
    outputs:
      container_app_fqdn: ${{ steps.tf_outputs.outputs.container_app_fqdn }}
      entra_client_id: ${{ steps.tf_outputs.outputs.entra_client_id }}
      entra_tenant_id: ${{ steps.tf_outputs.outputs.entra_tenant_id }}
      entra_api_scope: ${{ steps.tf_outputs.outputs.entra_api_scope }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          TAG="gha-${{ github.run_number }}"
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/azure-microsoftfoundry-agentic-finetuning-platform-backend:$TAG \
                       -t ${{ vars.DOCKERHUB_USERNAME }}/azure-microsoftfoundry-agentic-finetuning-platform-backend:latest .
          docker push ${{ vars.DOCKERHUB_USERNAME }}/azure-microsoftfoundry-agentic-finetuning-platform-backend:$TAG
          docker push ${{ vars.DOCKERHUB_USERNAME }}/azure-microsoftfoundry-agentic-finetuning-platform-backend:latest
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.FOUNDRY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.FOUNDRY_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.FOUNDRY_AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: terraform apply (rolls the Container App to the new image tag)
        working-directory: Azure-MicrosoftFoundry-Agentic-FineTuning-Platform/infra/terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve \
            -var="dockerhub_username=${{ vars.DOCKERHUB_USERNAME }}" \
            -var="backend_image_tag=${IMAGE_TAG}" \
            -var="budget_contact_emails=${{ vars.BUDGET_ALERT_EMAILS || '[]' }}"

      - name: Read Terraform outputs for the frontend build
        id: tf_outputs
        working-directory: Azure-MicrosoftFoundry-Agentic-FineTuning-Platform/infra/terraform
        run: |
          echo "container_app_fqdn=$(terraform output -raw container_app_fqdn)" >> "$GITHUB_OUTPUT"
          echo "entra_client_id=$(terraform output -raw entra_signin_client_id)" >> "$GITHUB_OUTPUT"
          echo "entra_tenant_id=$(terraform output -raw entra_tenant_id)" >> "$GITHUB_OUTPUT"
          echo "entra_api_scope=$(terraform output -raw entra_api_scope)" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build + deploy frontend to Static Web App
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azure-MicrosoftFoundry-Agentic-FineTuning-Platform/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Azure-MicrosoftFoundry-Agentic-FineTuning-Platform/frontend/package-lock.json

      - run: npm ci

      - name: Build (VITE_ENTRA_* wires in real Microsoft sign-in for this build only)
        env:
          VITE_API_BASE_URL: ${{ needs.backend.outputs.container_app_fqdn }}
          VITE_ENTRA_CLIENT_ID: ${{ needs.backend.outputs.entra_client_id }}
          VITE_ENTRA_TENANT_ID: ${{ needs.backend.outputs.entra_tenant_id }}
          VITE_ENTRA_API_SCOPE: ${{ needs.backend.outputs.entra_api_scope }}
        run: npm run build

      - name: Deploy to Static Web App
        run: npx --yes @azure/static-web-apps-cli deploy ./dist --deployment-token "${{ secrets.FOUNDRY_SWA_DEPLOYMENT_TOKEN }}" --env production
