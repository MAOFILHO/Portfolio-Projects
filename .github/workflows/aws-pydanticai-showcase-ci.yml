name: AWS-PydanticAi-Showcase CI

# Runs on every push/PR that touches this project's folder. Offline only —
# every agent is overridden with TestModel/FunctionModel and
# ALLOW_MODEL_REQUESTS=False fails loudly if a test ever tries a real
# request, so this never spends real OpenAI credit. See
# aws-pydanticai-showcase-deploy.yml for the AWS-touching workflow.
on:
  push:
    branches: [main]
    paths:
      - "AWS-PydanticAi-Showcase/**"
  pull_request:
    branches: [main]
    paths:
      - "AWS-PydanticAi-Showcase/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS-PydanticAi-Showcase
    env:
      # Dummy key so Agent construction succeeds at import time — every test
      # overrides the model with TestModel/FunctionModel, so no real request
      # is ever made (enforced by ALLOW_MODEL_REQUESTS=False in conftest.py).
      OPENAI_API_KEY: sk-test-mock-key-for-ci
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright app tests evals

      - name: Test
        run: uv run pytest -v
