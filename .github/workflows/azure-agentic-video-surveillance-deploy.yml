name: Azure-Agentic-Video-Surveillance — Deploy to Azure

# Manual-only (workflow_dispatch): a human must explicitly click "Run
# workflow" for this to fire -- there is no automatic trigger on push or on
# CI success (see azure-agentic-video-surveillance-ci.yml for the free, no-cost
# gate). Uses secretless federated (OIDC) Azure credentials.
#
# NOTE: this repo (Portfolio-Projects) is a different GitHub repo from the
# standalone github.com/MAOFILHO/Azure-RealTime-Video-Surveillance repo this
# pipeline was originally developed/tested against (that standalone repo's
# name was NOT changed as part of this project's Azure-Agentic-Video-Surveillance
# rename -- it's a separate repo). The Azure AD app
# registration's federated credential trusts a specific
# repo:<owner>@<owner-id>/<repo>@<repo-id>:ref:... subject -- it will need a
# *second* federated credential added (or a separate app registration)
# trusting this repo's subject before `azure/login` below can authenticate.
# The AZURE_CLIENT_ID/AZURE_TENANT_ID/etc. repository variables and the
# GOOGLE_*/GCP_* secrets also need to be (re)configured here -- they don't
# carry over automatically from the other repo.
on:
  workflow_dispatch:
    inputs:
      teardown_after:
        description: "Tear down all resources immediately after a successful deploy + smoke test (useful for a scheduled cost-safe validation run)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Without this, two pushes close together (or a manual dispatch overlapping
# an auto-triggered run) could start two concurrent deploys racing the same
# resource group -- e.g. two `az deployment sub create` calls or two Function
# code publishes at once. cancel-in-progress is deliberately false: cancelling
# a live infra/Function deploy mid-flight is worse than making the next one
# wait, since Azure resources can be left half-applied.
concurrency:
  group: deploy-azure-agentic-video-surveillance-${{ vars.AZURE_ENV_NAME || 'surveil' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azure-Agentic-Video-Surveillance
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      VISION_SKU: ${{ vars.VISION_SKU }}
      STORAGE_SKU_NAME: ${{ vars.STORAGE_SKU_NAME }}
      ALERT_WATCH_TAGS: ${{ vars.ALERT_WATCH_TAGS }}
      ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
      # Langfuse (opt-in agent/LLM-level tracing, see shared/surveil_core/agents/tracing.py).
      # Leave LANGFUSE_PUBLIC_KEY unset to deploy with it disabled -- Application Insights
      # tracing is unaffected either way. The public key is not secret by Langfuse's own
      # threat model, but the secret key must be a repo secret, never a variable.
      LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
      IMAGE_BUILD_MODE: acr
      # Nest doorbell ingestor (opt-in; adds an always-on Container App --
      # see docs/cost.md). Leave NEST_INGESTOR_ENABLED unset/false to deploy
      # everything else without it.
      NEST_INGESTOR_ENABLED: ${{ vars.NEST_INGESTOR_ENABLED || 'false' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DEVICE_ACCESS_PROJECT_ID: ${{ secrets.GOOGLE_DEVICE_ACCESS_PROJECT_ID }}
      GOOGLE_DEVICES: ${{ secrets.GOOGLE_DEVICES }}
      GCP_PUBSUB_PROJECT_ID: ${{ secrets.GCP_PUBSUB_PROJECT_ID }}
      GCP_PUBSUB_SUBSCRIPTION_ID: ${{ vars.GCP_PUBSUB_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Install surveil-deploy
        run: |
          pip install -e ".[dev]"
          pip install -e ./shared

      - name: Write GCP service-account key (Nest ingestor only)
        if: ${{ vars.NEST_INGESTOR_ENABLED == 'true' }}
        run: echo "$GCP_KEY_JSON" > "$RUNNER_TEMP/gcp-key.json"
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_JSON }}

      - name: Generate E2E test fixture (gitignored — licensing unconfirmed for redistribution, see tests/fixtures/README.md)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -i sample_videos/swat-soldier-with-weapon-13884574-720p.mp4 -vframes 1 tests/fixtures/person_test_frame.jpg

      - name: Deploy
        run: surveil-deploy deploy
        env:
          GCP_SERVICE_ACCOUNT_KEY_PATH: ${{ vars.NEST_INGESTOR_ENABLED == 'true' && format('{0}/gcp-key.json', runner.temp) || '' }}

      - name: Post-deploy smoke test
        run: surveil-deploy smoke-test --stage post

      - name: Tear down (if requested)
        if: ${{ inputs.teardown_after }}
        run: surveil-deploy teardown -y
