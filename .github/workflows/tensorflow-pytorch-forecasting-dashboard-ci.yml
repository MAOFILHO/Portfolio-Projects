name: TensorFlow-PyTorch-Forecasting-Dashboard CI

on:
  push:
    branches: ["main"]
    paths:
      - "TensorFlow-PyTorch-Forecasting-Dashboard/**"
  pull_request:
    branches: ["main"]
    paths:
      - "TensorFlow-PyTorch-Forecasting-Dashboard/**"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TensorFlow-PyTorch-Forecasting-Dashboard/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: TensorFlow-PyTorch-Forecasting-Dashboard/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TensorFlow-PyTorch-Forecasting-Dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: TensorFlow-PyTorch-Forecasting-Dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build