name: Azure-Foundry-Agentic-FineTuning-Platform — Deploy (provision AI infra + live run)

# Manual only — provisions real, billing Azure resources (the Foundry
# account, base model deployments). Never runs on push/PR. Uses OIDC
# (no stored secret) against a dedicated app registration + a least-privilege
# custom role scoped to only this project's resource group (see
# infra/foundry-deployer-role.json) — created by a one-time local
# `terraform apply` with elevated credentials (see hosting.tf's header
# comment), not by this workflow.
#
# FOUNDRY_AZURE_* variable names, not the plain AZURE_* names other projects'
# deploy workflows in this repo use — this repo's GitHub Variables are
# shared across every project, and each authenticates as a different Azure
# AD app, so distinct names avoid one project's variables overwriting
# another's.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "provision" to confirm you want to create billing Azure resources'
        required: true

env:
  DEMO_MODE: live
  RUN_LIVE_SMOKE: "1"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure-foundry-agentic-finetuning-platform
  cancel-in-progress: false

jobs:
  guard:
    name: Require explicit confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "provision" ]; then
            echo "::error::Re-run this workflow with confirm=provision to proceed."
            exit 1
          fi

  deploy:
    name: Provision + live run
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Azure-Foundry-Agentic-FineTuning-Platform
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.FOUNDRY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.FOUNDRY_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.FOUNDRY_AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Pre-provision smoke tests
        run: pytest tests/smoke_pre -v

      - name: terraform init
        working-directory: Azure-Foundry-Agentic-FineTuning-Platform/infra/terraform
        run: terraform init -input=false

      - name: terraform apply (budget alert created before anything billable)
        working-directory: Azure-Foundry-Agentic-FineTuning-Platform/infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="enable_next_suffix_probe=true" \
            -var="dockerhub_username=${{ vars.DOCKERHUB_USERNAME }}" \
            -var="budget_contact_emails=${{ vars.BUDGET_ALERT_EMAILS || '[]' }}"

      - name: Post-provision smoke tests (every resource live + approved SKU)
        run: pytest tests/smoke_post_provision -v

      - name: Sync .env from Terraform outputs
        run: PYTHONPATH=src python -m app.cli sync-env

      - name: Live run (all 3 workflows, real Azure Foundry calls — this bills tokens)
        run: |
          echo "::warning::LIVE MODE — this run bills real tokens and provisioned a fine-tuning deployment."
          PYTHONPATH=src python -m app.cli run-all

      - name: Post-run smoke tests (outputs exist and are non-empty)
        run: pytest tests/smoke_post_run -v

      - name: Reminder
        if: always()
        run: |
          echo "::warning::Resources are live and billing. Run the 'Teardown' workflow when done, or 'make teardown' locally."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-run-outputs
          path: Azure-Foundry-Agentic-FineTuning-Platform/outputs/
